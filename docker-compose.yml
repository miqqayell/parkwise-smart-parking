# Local PostgreSQL for all ParkWise components. Start with: docker compose up -d
# The other tables (notifications, logs, alerts) are created by the web app (JPA).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: iotdb
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - parkwise-data:/var/lib/postgresql/data

volumes:
  parkwise-data:
