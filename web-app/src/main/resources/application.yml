spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/iotdb}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update   # creates tables automatically (use "validate" or "none" later in prod)
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  application:
    name: SmartParkingAssistant

server:
  port: 8080

app:
  ai-model:
    url: ${AI_MODEL_URL:http://localhost:8000}
    endpoint: /predict_all
  monitoring:
    inactivity-threshold-minutes: 10
