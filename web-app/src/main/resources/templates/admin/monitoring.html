<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head('Sensor Monitoring – ParkWise')"></head>
<body>
<nav th:replace="fragments/nav :: nav"></nav>

<main class="container fade-in" style="padding-top: 90px;">
    <h1 class="fw-bold mb-4">Sensor Monitoring Dashboard</h1>

    <!-- Stats Cards Row -->
    <div class="row g-4 mb-4">
        <div class="col-md-3 col-sm-6">
            <div class="card shadow-sm scale-hover" style="background-color: #00b532 !important; border: none; border-radius: 20px;">
                <div class="card-body" style="background-color: transparent !important;">
                    <h6 class="text-uppercase mb-2" style="font-size: 0.85rem; opacity: 0.9; color: white !important;">Total Sensors</h6>
                    <h3 class="fw-bold mb-0" style="color: white !important;" id="totalSensors">0</h3>
                </div>
            </div>
        </div>
        <div class="col-md-3 col-sm-6">
            <div class="card shadow-sm scale-hover" style="background-color: #00b532 !important; border: none; border-radius: 20px;">
                <div class="card-body" style="background-color: transparent !important;">
                    <h6 class="text-uppercase mb-2" style="font-size: 0.85rem; opacity: 0.9; color: white !important;">Online Sensors</h6>
                    <h3 class="fw-bold mb-0" style="color: white !important;" id="onlineSensors">0</h3>
                </div>
            </div>
        </div>
        <div class="col-md-3 col-sm-6">
            <div class="card shadow-sm scale-hover" style="background-color: #dc3545 !important; border: none; border-radius: 20px;">
                <div class="card-body" style="background-color: transparent !important;">
                    <h6 class="text-uppercase mb-2" style="font-size: 0.85rem; opacity: 0.9; color: white !important;">Offline Sensors</h6>
                    <h3 class="fw-bold mb-0" style="color: white !important;" id="offlineSensors">0</h3>
                </div>
            </div>
        </div>
        <div class="col-md-3 col-sm-6">
            <div class="card shadow-sm scale-hover" style="background-color: #17a2b8 !important; border: none; border-radius: 20px;">
                <div class="card-body" style="background-color: transparent !important;">
                    <h6 class="text-uppercase mb-2" style="font-size: 0.85rem; opacity: 0.9; color: white !important;">Last Updated</h6>
                    <h6 class="fw-bold mb-0" style="color: white !important;" id="lastUpdate">--:--:--</h6>
                </div>
            </div>
        </div>
    </div>

    <!-- Sensors Table -->
    <div class="card shadow-sm" style="border-radius: 20px; border: none;">
        <div class="card-body">
            <h5 class="fw-bold mb-3">Sensor Status</h5>
            <div class="table-responsive">
                <table class="table table-hover" id="sensorsTable">
                    <thead>
                        <tr>
                            <th>Sensor ID</th>
                            <th>Type</th>
                            <th>Parking Spot</th>
                            <th>Status</th>
                            <th>Last Ping</th>
                            <th>Occupancy</th>
                        </tr>
                    </thead>
                    <tbody id="sensorsTableBody">
                        <tr>
                            <td colspan="6" class="text-center text-muted">Loading sensor data...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<div th:replace="fragments/nav :: modals"></div>

<script>
    function fetchSensorStatus() {
        fetch('/api/sensors/status')
            .then(response => response.json())
            .then(data => {
                updateDashboard(data);
            })
            .catch(error => {
                console.error('Error fetching sensor status:', error);
            });
    }

    function updateDashboard(sensors) {
        // Update stats cards
        const totalSensors = sensors.length;
        const onlineSensors = sensors.filter(s => s.status === 'ONLINE').length;
        const offlineSensors = sensors.filter(s => s.status === 'OFFLINE').length;

        document.getElementById('totalSensors').textContent = totalSensors;
        document.getElementById('onlineSensors').textContent = onlineSensors;
        document.getElementById('offlineSensors').textContent = offlineSensors;

        // Update last update time
        const now = new Date();
        const timeString = now.toLocaleTimeString('en-GB');
        document.getElementById('lastUpdate').textContent = timeString;

        // Update table
        const tbody = document.getElementById('sensorsTableBody');

        if (sensors.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">No sensors found</td></tr>';
            return;
        }

        tbody.innerHTML = sensors.map(sensor => {
            // Format last ping time
            let lastPingDisplay = 'Never';
            if (sensor.lastPing) {
                const pingDate = new Date(sensor.lastPing);
                lastPingDisplay = pingDate.toLocaleString('en-GB', {
                    day: '2-digit',
                    month: 'short',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                });
            }

            // Status badge
            const statusColor = sensor.status === 'ONLINE' ? '#00b532' : '#dc3545';
            const statusBadge = `<span class="badge" style="background-color: ${statusColor};">${sensor.status}</span>`;

            // Occupancy badge
            let occupancyBadge = '<span class="badge bg-secondary">UNKNOWN</span>';
            if (sensor.occupied === true) {
                occupancyBadge = '<span class="badge" style="background-color: #dc3545;">OCCUPIED</span>';
            } else if (sensor.occupied === false) {
                occupancyBadge = '<span class="badge" style="background-color: #00b532;">FREE</span>';
            }

            // Parking spot display
            const spotDisplay = sensor.spotNumber !== null
                ? `Spot #${sensor.spotNumber}`
                : 'N/A';

            return `
                <tr>
                    <td>${sensor.sensorId}</td>
                    <td>${sensor.sensorType || 'N/A'}</td>
                    <td>${spotDisplay}</td>
                    <td>${statusBadge}</td>
                    <td>${lastPingDisplay}</td>
                    <td>${occupancyBadge}</td>
                </tr>
            `;
        }).join('');
    }

    // Poll every 5 seconds
    setInterval(fetchSensorStatus, 5000);

    // Initial load
    fetchSensorStatus();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
