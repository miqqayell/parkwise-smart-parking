<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('AI District Prediction')}"></head>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
    #map { height: 75vh; width: 100%; border-radius: 12px; z-index: 1; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    .overlay-panel {
        position: absolute; top: 20px; right: 20px; z-index: 999;
        background: rgba(255, 255, 255, 0.95);
        padding: 20px; border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.15); width: 300px;
        backdrop-filter: blur(5px);
    }
    .legend {
        line-height: 24px; color: #333; background: white; padding: 15px;
        border-radius: 8px; box-shadow: 0 0 15px rgba(0,0,0,0.2);
    }
    .legend i {
        width: 18px; height: 18px; float: left; margin-right: 8px; border-radius: 3px;
    }
</style>

<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<main class="container-fluid p-0 position-relative">
    <div id="map"></div>

    <div class="overlay-panel">
        <h4 class="fw-bold mb-2"><i class="bi bi-cpu"></i> Live AI Forecast</h4>
        <p class="text-muted small mb-3">Connected to Model: <span class="badge bg-success">Online</span></p>

        <label class="form-label fw-bold small">Select Time</label>
        <input type="time" id="timeSelector" class="form-control mb-3">

        <button id="predictBtn" class="btn btn-primary w-100 py-2">
            Generate Prediction
        </button>
        <div id="loading" class="text-center mt-3 d-none">
            <div class="spinner-border text-primary spinner-border-sm" role="status"></div>
            <span class="ms-2 small text-muted">Asking AI Model...</span>
        </div>
    </div>
</main>

<div th:replace="~{fragments/nav :: modals}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        // 1. Map Setup
        var map = L.map('map').setView([51.2194, 4.4025], 13);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap &copy; CARTO'
        }).addTo(map);

        // 2. District Configuration (Names MUST match Python keys exactly)
        const districts = [
            {
                name: "Historic Center", // Python Key
                coords: [
                    [51.2290, 4.4000], [51.2300, 4.4050], [51.2250, 4.4150],
                    [51.2200, 4.4180], [51.2150, 4.4120], [51.2120, 4.4080],
                    [51.2080, 4.3950], [51.2150, 4.3900], [51.2250, 4.3920]
                ]
            },
            {
                name: "Noord", // Python Key
                coords: [
                    [51.2350, 4.4200], [51.2350, 4.4500], [51.2200, 4.4500],
                    [51.2150, 4.4300], [51.2180, 4.4200], [51.2200, 4.4180]
                ]
            },
            {
                name: "Zuid", // Python Key
                coords: [
                    [51.2120, 4.4080], [51.2050, 4.4000], [51.2000, 4.3850],
                    [51.2050, 4.3800], [51.2150, 4.3900]
                ]
            },
            {
                name: "Borgerhout", // Python Key
                coords: [
                    [51.2200, 4.4500], [51.2100, 4.4550], [51.2080, 4.4300],
                    [51.2150, 4.4300]
                ]
            }
        ];

        let geoJsonLayer = null;

        // 3. Color Logic based on Python values (1, 2, 3)
        function getColor(value) {
            // 1 = Low Traffic (Green)
            // 2 = Medium Traffic (Orange)
            // 3 = High Traffic (Red)
            if (value === 3) return '#ef4444'; // Red
            if (value === 2) return '#f97316'; // Orange
            return '#22c55e'; // Green (Default 1)
        }

        function style(feature) {
            return {
                fillColor: getColor(feature.properties.trafficLevel),
                weight: 2,
                opacity: 1,
                color: 'white',
                dashArray: '3',
                fillOpacity: 0.7
            };
        }

        // Initialize Time Input
        const now = new Date();
        now.setHours(now.getHours() + 1);
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        document.getElementById('timeSelector').value = `${hours}:${minutes}`;

        // 4. Fetch Real Data
        document.getElementById('predictBtn').addEventListener('click', function() {
            const btn = this;
            const loader = document.getElementById('loading');
            const timeVal = document.getElementById('timeSelector').value;

            if (!timeVal) { alert("Please select a time"); return; }

            // UI Loading
            btn.disabled = true;
            loader.classList.remove('d-none');

            // Construct ISO Date
            const targetDate = new Date();
            const [h, m] = timeVal.split(':');
            targetDate.setHours(h, m, 0, 0);
            const offset = targetDate.getTimezoneOffset() * 60000;
            const isoDateTime = new Date(targetDate.getTime() - offset).toISOString().slice(0, 19);

            // Call Spring Boot -> which calls FastAPI
            fetch(`/api/prediction/generate?time=${isoDateTime}`)
                .then(response => response.json())
                .then(data => {
                    // data structure: { predictions: { "Zuid": 3, "Noord": 1 ... } }

                    if (!data || !data.predictions) {
                        throw new Error("Invalid data from model");
                    }

                    const apiPredictions = data.predictions;

                    // Map API data to our Polygon features
                    const geoJsonData = {
                        "type": "FeatureCollection",
                        "features": districts.map(d => ({
                            "type": "Feature",
                            "properties": {
                                "name": d.name,
                                // Get value from API, default to 1 (Low) if missing
                                "trafficLevel": apiPredictions[d.name] || 1
                            },
                            "geometry": {
                                "type": "Polygon",
                                "coordinates": [d.coords.map(c => [c[1], c[0]])]
                            }
                        }))
                    };

                    if (geoJsonLayer) map.removeLayer(geoJsonLayer);

                    geoJsonLayer = L.geoJSON(geoJsonData, {
                        style: style,
                        onEachFeature: function(feature, layer) {
                            let statusText = "Low Traffic";
                            let level = feature.properties.trafficLevel;
                            if (level === 2) statusText = "Medium Traffic";
                            if (level === 3) statusText = "High Traffic";

                            layer.bindPopup(
                                `<div class='text-center'>
                                    <strong>${feature.properties.name}</strong><br>
                                    <span class='badge ${level===3?"bg-danger":level===2?"bg-warning":"bg-success"}'>
                                        ${statusText}
                                    </span>
                                 </div>`
                            );
                        }
                    }).addTo(map);

                    // Add Legend
                    if (!document.querySelector('.legend')) {
                        var legend = L.control({position: 'bottomright'});
                        legend.onAdd = function (map) {
                            var div = L.DomUtil.create('div', 'legend');
                            div.innerHTML += '<strong>Forecast</strong><br>';
                            div.innerHTML += '<i style="background:#22c55e"></i> Low (1)<br>';
                            div.innerHTML += '<i style="background:#f97316"></i> Medium (2)<br>';
                            div.innerHTML += '<i style="background:#ef4444"></i> High (3)<br>';
                            return div;
                        };
                        legend.addTo(map);
                    }

                })
                .catch(err => {
                    console.error(err);
                    alert("Failed to reach AI Model. Check server logs.");
                })
                .finally(() => {
                    btn.disabled = false;
                    loader.classList.add('d-none');
                });
        });
    });
</script>
</body>
</html>
