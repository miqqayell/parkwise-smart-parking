<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head('System Logs – ParkWise')"></head>
<body>
<nav th:replace="fragments/nav :: nav"></nav>

<main class="container fade-in" style="padding-top: 90px;">
    <h1 class="fw-bold mb-4">System Logs Dashboard</h1>

    <!-- Stats Cards Row -->
    <div class="row g-4 mb-4">
        <div class="col-md-3 col-sm-6">
            <div class="card shadow-sm scale-hover" style="background-color: #dc3545 !important; border: none; border-radius: 20px;">
                <div class="card-body" style="background-color: transparent !important;">
                    <h6 class="text-uppercase mb-2" style="font-size: 0.85rem; opacity: 0.9; color: white !important;">Total Errors</h6>
                    <h3 class="fw-bold mb-0" style="color: white !important;" th:text="${statistics.totalErrors}">0</h3>
                </div>
            </div>
        </div>
        <div class="col-md-3 col-sm-6">
            <div class="card shadow-sm scale-hover" style="background-color: #ffc107 !important; border: none; border-radius: 20px;">
                <div class="card-body" style="background-color: transparent !important;">
                    <h6 class="text-uppercase mb-2" style="font-size: 0.85rem; opacity: 0.9; color: white !important;">Total Warnings</h6>
                    <h3 class="fw-bold mb-0" style="color: white !important;" th:text="${statistics.totalWarnings}">0</h3>
                </div>
            </div>
        </div>
        <div class="col-md-3 col-sm-6">
            <div class="card shadow-sm scale-hover" style="background-color: #dc3545 !important; border: none; border-radius: 20px;">
                <div class="card-body" style="background-color: transparent !important;">
                    <h6 class="text-uppercase mb-2" style="font-size: 0.85rem; opacity: 0.9; color: white !important;">Errors (24h)</h6>
                    <h3 class="fw-bold mb-0" style="color: white !important;" th:text="${statistics.errors24h}">0</h3>
                </div>
            </div>
        </div>
        <div class="col-md-3 col-sm-6">
            <div class="card shadow-sm scale-hover" style="background-color: #17a2b8 !important; border: none; border-radius: 20px;">
                <div class="card-body" style="background-color: transparent !important;">
                    <h6 class="text-uppercase mb-2" style="font-size: 0.85rem; opacity: 0.9; color: white !important;">Total Logs</h6>
                    <h3 class="fw-bold mb-0" style="color: white !important;" th:text="${statistics.totalLogs}">0</h3>
                </div>
            </div>
        </div>
    </div>

    <!-- Filters Row -->
    <div class="card shadow-sm mb-4" style="border-radius: 20px; border: none;">
        <div class="card-body">
            <h5 class="fw-bold mb-3">Filters</h5>
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Filter by Level:</label>
                    <select class="form-select" id="levelFilter" onchange="applyFilter()">
                        <option value="">All Levels</option>
                        <option value="ERROR" th:selected="${currentLevel == 'ERROR'}">ERROR</option>
                        <option value="WARN" th:selected="${currentLevel == 'WARN'}">WARN</option>
                        <option value="INFO" th:selected="${currentLevel == 'INFO'}">INFO</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Filter by Category:</label>
                    <select class="form-select" id="categoryFilter" onchange="applyFilter()">
                        <option value="">All Categories</option>
                        <option value="SENSOR_ERROR" th:selected="${currentCategory == 'SENSOR_ERROR'}">SENSOR_ERROR</option>
                        <option value="NETWORK_ERROR" th:selected="${currentCategory == 'NETWORK_ERROR'}">NETWORK_ERROR</option>
                        <option value="DATA_ERROR" th:selected="${currentCategory == 'DATA_ERROR'}">DATA_ERROR</option>
                        <option value="SYSTEM_ERROR" th:selected="${currentCategory == 'SYSTEM_ERROR'}">SYSTEM_ERROR</option>
                        <option value="INFO" th:selected="${currentCategory == 'INFO'}">INFO</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-semibold">&nbsp;</label>
                    <button class="btn w-100" style="background-color: #00b532; color: white;" onclick="clearFilters()">
                        Clear Filters
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Logs Table -->
    <div class="card shadow-sm" style="border-radius: 20px; border: none;">
        <div class="card-body">
            <h5 class="fw-bold mb-3">System Logs</h5>
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>Time</th>
                            <th>Level</th>
                            <th>Category</th>
                            <th>Message</th>
                            <th>Source</th>
                            <th>Details</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(logs)}">
                            <td colspan="6" class="text-center text-muted">No logs found</td>
                        </tr>
                        <tr th:each="log : ${logs}">
                            <td th:text="${#temporals.format(log.createdAt, 'dd MMM HH:mm:ss')}">--</td>
                            <td>
                                <span class="badge"
                                      th:classappend="${log.logLevel == 'ERROR'} ? 'bg-danger' :
                                                      (${log.logLevel == 'WARN'} ? 'bg-warning' : 'bg-info')"
                                      th:text="${log.logLevel}">INFO</span>
                            </td>
                            <td>
                                <span class="badge bg-secondary" th:text="${log.logCategory}">CATEGORY</span>
                            </td>
                            <td th:text="${log.message}">Message</td>
                            <td>
                                <small th:if="${log.sourceClass != null}">
                                    <span th:text="${log.sourceClass}">Class</span>.<span th:text="${log.sourceMethod}">method</span>
                                </small>
                                <small th:if="${log.sourceClass == null}" class="text-muted">N/A</small>
                            </td>
                            <td>
                                <button th:if="${log.details != null}"
                                        class="btn btn-sm btn-outline-primary"
                                        th:onclick="'showDetails(' + ${log.id} + ')'">
                                    View
                                </button>
                                <span th:if="${log.details == null}" class="text-muted">-</span>
                                <!-- Hidden details -->
                                <div th:id="'details-' + ${log.id}" style="display: none;" th:text="${log.details}"></div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<div th:replace="fragments/nav :: modals"></div>

<!-- Details Modal -->
<div class="modal fade" id="detailsModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Log Details</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <pre id="modalDetailsContent" style="white-space: pre-wrap; font-size: 0.85rem;"></pre>
            </div>
        </div>
    </div>
</div>

<script>
    function applyFilter() {
        const level = document.getElementById('levelFilter').value;
        const category = document.getElementById('categoryFilter').value;

        let url = '/developer/logs?';
        if (level) url += 'level=' + level + '&';
        if (category) url += 'category=' + category;

        window.location.href = url;
    }

    function clearFilters() {
        window.location.href = '/developer/logs';
    }

    function showDetails(logId) {
        const detailsElement = document.getElementById('details-' + logId);
        if (detailsElement) {
            const details = detailsElement.textContent;
            document.getElementById('modalDetailsContent').textContent = details;
            new bootstrap.Modal(document.getElementById('detailsModal')).show();
        }
    }

    // Auto-refresh every 10 seconds
    setInterval(function() {
        location.reload();
    }, 10000);
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
