    <script>
        document.addEventListener("DOMContentLoaded", function () {

            const map = L.map('map').setView([51.2194, 4.4025], 14);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap contributors',
                maxZoom: 19
            }).addTo(map);

            const greenIcon = new L.Icon({
                iconUrl: 'https://maps.google.com/mapfiles/ms/icons/green-dot.png',
                iconSize: [32, 32]
            });

            const redIcon = new L.Icon({
                iconUrl: 'https://maps.google.com/mapfiles/ms/icons/red-dot.png',
                iconSize: [32, 32]
            });

            const orangeIcon = new L.Icon({
                iconUrl: 'https://maps.google.com/mapfiles/ms/icons/orange-dot.png',
                iconSize: [32, 32]
            });

            let markers = {};

            function statusToIcon(status) {
                if (status === "FREE") return greenIcon;
                if (status === "OCCUPIED") return redIcon;
                return orangeIcon; // UNKNOWN
            }

            function loadSpots() {
                fetch("/api/spots")
                    .then(r => r.json())
                    .then(spots => {
                        spots.forEach(s => {

                            let marker = L.marker([s.latitude, s.longitude], {
                                icon: statusToIcon(s.status)
                            }).addTo(map);

                            marker.bindPopup(`<b>${s.label}</b><br>Status: ${s.status}`);

                            markers[s.id] = marker;
                        });
                    });
            }

            function updateStatuses() {
                fetch("/api/spots/status")
                    .then(r => r.json())
                    .then(statusList => {

                        statusList.forEach(s => {
                            const marker = markers[s.spotId];

                            if (marker) {
                                const icon = statusToIcon(s.status);
                                marker.setIcon(icon);
                                marker.setPopupContent(`<b>Spot ${s.spotId}</b><br>Status: ${s.status}`);
                            }
                        });
                    });
            }

            loadSpots();
            setInterval(updateStatuses, 100);
        });

    </script>
