<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head('Log in – ParkWise')"></head>
<body>
<nav th:replace="fragments/nav :: navbar"></nav>

<main class="container" style="padding-top: 90px;">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card border-0 shadow-sm">
        <div class="card-body">
          <h3 class="mb-3">Log in</h3>

          <p th:if="${loginError}" class="text-danger small" th:text="${loginError}"></p>

          <form th:action="@{/login}" method="post">
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" name="email" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Password</label>
              <input type="password" name="password" class="form-control" required>
            </div>
            <button class="btn btn-primary w-100" type="submit">Log in</button>
          </form>

          <p class="mt-3 mb-0 small text-muted">
            (For now, any email/password combo will log you in as a demo user.)
          </p>
        </div>
      </div>
    </div>
  </div>
</main>

<div th:replace="fragments/nav :: modals"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
